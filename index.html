<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Queue Simulation — Snapshot Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#222;min-height:100vh}
header{background:#1F3864;color:#fff;padding:1.2rem 2rem}
header h1{font-size:1.3rem;font-weight:600}
header p{font-size:.85rem;opacity:.7;margin-top:4px}
.container{max-width:1100px;margin:2rem auto;padding:0 1rem}
.card{background:#fff;border-radius:12px;border:1px solid #e0e4ef;padding:1.5rem;margin-bottom:1.2rem}
.card-title{font-size:.75rem;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem}
.mode-tabs{display:flex;gap:8px;margin-bottom:1rem}
.tab{padding:7px 18px;border-radius:8px;border:1px solid #d0d5e8;background:transparent;font-size:13px;cursor:pointer;color:#444}
.tab.active{background:#1F3864;color:#fff;border-color:#1F3864}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;color:#666}
.field input{padding:8px 12px;border:1px solid #d0d5e8;border-radius:8px;font-size:14px;width:100%}
.btn-run{padding:10px 28px;border-radius:8px;border:none;background:#1F3864;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:.5rem;display:block}
.btn-run:hover{background:#2E75B6}
.btn-gen{padding:7px 16px;border-radius:8px;border:1px solid #d0d5e8;background:#f4f6fb;font-size:13px;cursor:pointer;margin-bottom:.5rem}
.preview{font-size:12px;color:#666;margin-top:4px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1F3864;color:#fff;padding:9px 10px;text-align:center;font-weight:500}
td{padding:8px 10px;text-align:center;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#f9fafc}
tr.wait-row td{background:#fff8dc}
tr.nosvc td{color:#bbb}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:6px;font-weight:600}
.badge-wait{background:#fff0b3;color:#7a5c00}
.badge-ok{background:#d4f5d4;color:#1a6b1a}
.badge-no{background:#f0f0f0;color:#888}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:1rem}
.stat{background:#f4f6fb;border-radius:10px;padding:1rem;text-align:center}
.stat-label{font-size:12px;color:#888;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700;color:#1F3864}
.tl-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tl-label{width:50px;text-align:right;font-size:12px;color:#888;flex-shrink:0}
.tl-wrap{flex:1;position:relative;height:20px;background:#f0f2f8;border-radius:4px;overflow:hidden}
.tl-wait{position:absolute;height:100%;background:#f0d080}
.tl-svc{position:absolute;height:100%;background:#2E75B6;border-radius:2px}
.tl-end{font-size:11px;color:#aaa;width:45px;flex-shrink:0}
.legend{display:flex;gap:16px;font-size:12px;color:#666;margin-bottom:.6rem}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.err{color:#c0392b;font-size:13px;margin-top:.5rem;padding:8px;background:#fdecea;border-radius:6px}
#results{display:none}
#panel-random{display:none}
</style>
</head>
<body>

<header>
  <h1>Queue Simulation — Snapshot Viewer</h1>
  <p>Single-Server Queuing System</p>
</header>

<div class="container">

  <div class="card">
    <div class="card-title">Input Mode</div>
    <div class="mode-tabs">
      <button class="tab active" id="tab-manual" onclick="setMode('manual')">Manual entry</button>
      <button class="tab" id="tab-random" onclick="setMode('random')">Random generate</button>
    </div>

    <div id="panel-manual">
      <div class="field">
        <label>Inter-arrival times (comma separated)</label>
        <input type="text" id="iat-input" value="0.4,1.2,0.5,1.7,0.2,1.2,0.4,1.6"/>
      </div>
      <div class="field">
        <label>Service times (comma separated)</label>
        <input type="text" id="svc-input" value="2,0.7,0.2,1.1,3.7"/>
      </div>
    </div>

    <div id="panel-random">
      <div class="field">
        <label>Number of customers</label>
        <input type="number" id="rnd-n" value="8" min="2" max="30"/>
      </div>
      <div class="field">
        <label>Avg inter-arrival time (min)</label>
        <input type="number" id="rnd-iat" value="1.0" step="0.1" min="0.1"/>
      </div>
      <div class="field">
        <label>Avg service time (min)</label>
        <input type="number" id="rnd-svc" value="1.5" step="0.1" min="0.1"/>
      </div>
      <div class="field">
        <label>Customers with service data</label>
        <input type="number" id="rnd-served" value="5" min="1" max="30"/>
      </div>
      <button class="btn-gen" onclick="generateRandom()">Generate random values</button>
      <div class="preview" id="rnd-preview"></div>
    </div>

    <div id="err-msg"></div>
    <button class="btn-run" onclick="runSim()">Run Simulation</button>
  </div>

  <div id="results">
    <div class="card">
      <div class="card-title">Snapshot Table</div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Inter-Arrival</th>
              <th>Arrival Time</th>
              <th>Service Time</th>
              <th>Service Start</th>
              <th>Service End</th>
              <th>Wait Time</th>
              <th>Server Idle</th>
              <th>Time in System</th>
              <th>Queue Length</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sim-body"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Gantt Timeline</div>
      <div class="legend">
        <span><span class="dot" style="background:#f0d080"></span>Waiting</span>
        <span><span class="dot" style="background:#2E75B6"></span>Being served</span>
      </div>
      <div id="timeline"></div>
    </div>

    <div class="card">
      <div class="card-title">Summary Statistics</div>
      <div class="stats-grid" id="stats-grid"></div>
    </div>
  </div>

</div>

<script>
var mode = 'manual';
var rndIAT = [];
var rndSVC = [];

function setMode(m) {
  mode = m;
  document.getElementById('panel-manual').style.display = (m === 'manual') ? 'block' : 'none';
  document.getElementById('panel-random').style.display = (m === 'random') ? 'block' : 'none';
  document.getElementById('tab-manual').className = 'tab' + (m === 'manual' ? ' active' : '');
  document.getElementById('tab-random').className = 'tab' + (m === 'random' ? ' active' : '');
}

function expRandom(mean) {
  return -mean * Math.log(1 - Math.random());
}

function generateRandom() {
  var n = parseInt(document.getElementById('rnd-n').value) || 8;
  var mI = parseFloat(document.getElementById('rnd-iat').value) || 1.0;
  var mS = parseFloat(document.getElementById('rnd-svc').value) || 1.5;
  var served = Math.min(parseInt(document.getElementById('rnd-served').value) || 5, n);
  rndIAT = [];
  rndSVC = [];
  for (var i = 0; i < n; i++) rndIAT.push(parseFloat(expRandom(mI).toFixed(2)));
  for (var j = 0; j < served; j++) rndSVC.push(parseFloat(expRandom(mS).toFixed(2)));
  document.getElementById('rnd-preview').innerHTML =
    '<b>IAT:</b> ' + rndIAT.join(', ') + '<br><b>SVC:</b> ' + rndSVC.join(', ');
}

function parseList(s) {
  var parts = s.split(',');
  var result = [];
  for (var i = 0; i < parts.length; i++) {
    var v = parseFloat(parts[i].trim());
    if (!isNaN(v)) result.push(v);
  }
  return result;
}

function showErr(msg) {
  var el = document.getElementById('err-msg');
  if (msg) {
    el.className = 'err';
    el.textContent = msg;
  } else {
    el.className = '';
    el.textContent = '';
  }
}

function runSim() {
  showErr('');
  var iats, svcs;

  if (mode === 'manual') {
    iats = parseList(document.getElementById('iat-input').value);
    svcs = parseList(document.getElementById('svc-input').value);
  } else {
    if (!rndIAT.length) generateRandom();
    iats = rndIAT;
    svcs = rndSVC;
  }

  if (!iats.length) { showErr('Please enter valid inter-arrival times.'); return; }
  if (!svcs.length) { showErr('Please enter valid service times.'); return; }

  var n = iats.length;
  var arrival = [], svc = [], start = [], endT = [], wait = [], idle = [], tis = [];

  for (var i = 0; i < n; i++) {
    var sum = 0;
    for (var k = 0; k <= i; k++) sum += iats[k];
    var arr = parseFloat(sum.toFixed(4));
    arrival.push(arr);

    if (i < svcs.length) {
      var s = svcs[i];
      var ss = (i === 0) ? arr : parseFloat(Math.max(arr, endT[i-1]).toFixed(4));
      var se = parseFloat((ss + s).toFixed(4));
      var w  = parseFloat((ss - arr).toFixed(4));
      var id = (i === 0) ? arr : parseFloat(Math.max(0, arr - endT[i-1]).toFixed(4));
      var ti = parseFloat((se - arr).toFixed(4));
      svc.push(s); start.push(ss); endT.push(se);
      wait.push(w); idle.push(id); tis.push(ti);
    } else {
      svc.push(null); start.push(null); endT.push(null);
      wait.push(null); idle.push(null); tis.push(null);
    }
  }

  // Build table
  var tbody = document.getElementById('sim-body');
  tbody.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var ql = 0;
    for (var j = 0; j < i; j++) {
      if (endT[j] !== null && arrival[j] <= arrival[i] && arrival[i] < endT[j]) ql++;
    }
    var has = svc[i] !== null;
    var isW = has && wait[i] > 0;
    var tr = document.createElement('tr');
    if (isW) tr.className = 'wait-row';
    else if (!has) tr.className = 'nosvc';
    var badge = has
      ? (isW ? '<span class="badge badge-wait">waited</span>' : '<span class="badge badge-ok">direct</span>')
      : '<span class="badge badge-no">no data</span>';
    tr.innerHTML =
      '<td>' + (i+1) + '</td>' +
      '<td>' + iats[i] + '</td>' +
      '<td>' + arrival[i] + '</td>' +
      '<td>' + (has ? svc[i] : '—') + '</td>' +
      '<td>' + (has ? start[i] : '—') + '</td>' +
      '<td>' + (has ? endT[i] : '—') + '</td>' +
      '<td>' + (has ? wait[i] : '—') + '</td>' +
      '<td>' + (has ? idle[i] : '—') + '</td>' +
      '<td>' + (has ? tis[i] : '—') + '</td>' +
      '<td>' + ql + '</td>' +
      '<td>' + badge + '</td>';
    tbody.appendChild(tr);
  }

  // Timeline
  var servedEnds = endT.filter(function(v){ return v !== null; });
  var maxT = servedEnds.length ? Math.max.apply(null, servedEnds) : 10;
  var tl = document.getElementById('timeline');
  tl.innerHTML = '';
  for (var i = 0; i < n; i++) {
    if (svc[i] === null) continue;
    var row = document.createElement('div');
    row.className = 'tl-row';
    var waitBar = (wait[i] > 0)
      ? '<div class="tl-wait" style="left:' + (arrival[i]/maxT*100).toFixed(2) + '%;width:' + (wait[i]/maxT*100).toFixed(2) + '%"></div>'
      : '';
    row.innerHTML =
      '<div class="tl-label">C' + (i+1) + '</div>' +
      '<div class="tl-wrap">' + waitBar +
      '<div class="tl-svc" style="left:' + (start[i]/maxT*100).toFixed(2) + '%;width:' + (svc[i]/maxT*100).toFixed(2) + '%"></div></div>' +
      '<div class="tl-end">' + endT[i] + 'm</div>';
    tl.appendChild(row);
  }

  // Stats
  var sw = wait.filter(function(v){ return v !== null; });
  var ss2 = svc.filter(function(v){ return v !== null; });
  var st2 = tis.filter(function(v){ return v !== null; });
  var si  = idle.filter(function(v){ return v !== null; });
  var simEnd = servedEnds.length ? Math.max.apply(null, servedEnds) : 0;
  var totalIdle = si.reduce(function(a,b){ return a+b; }, 0);
  var util = simEnd > 0 ? ((simEnd - totalIdle) / simEnd * 100).toFixed(1) : 0;
  var avgW = (sw.reduce(function(a,b){ return a+b; },0) / sw.length).toFixed(3);
  var avgS = (ss2.reduce(function(a,b){ return a+b; },0) / ss2.length).toFixed(3);
  var avgT = (st2.reduce(function(a,b){ return a+b; },0) / st2.length).toFixed(3);

  document.getElementById('stats-grid').innerHTML =
    '<div class="stat"><div class="stat-label">Avg waiting time</div><div class="stat-val">' + avgW + ' min</div></div>' +
    '<div class="stat"><div class="stat-label">Avg service time</div><div class="stat-val">' + avgS + ' min</div></div>' +
    '<div class="stat"><div class="stat-label">Avg time in system</div><div class="stat-val">' + avgT + ' min</div></div>' +
    '<div class="stat"><div class="stat-label">Total idle time</div><div class="stat-val">' + totalIdle.toFixed(3) + ' min</div></div>' +
    '<div class="stat"><div class="stat-label">Simulation end</div><div class="stat-val">' + simEnd + ' min</div></div>' +
    '<div class="stat"><div class="stat-label">Server utilization</div><div class="stat-val">' + util + '%</div></div>';

  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
